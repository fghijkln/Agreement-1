[project]
name = "nebula-protocol"
version = "0.1.0"
description = "私有加密文件传输协议：.nbx 专属格式 + ChaCha20-Poly1305 E2E 加密"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.pytest.ini_options]
# 防回归（审计 5.1）：未关闭的文件/套接字直接让测试失败。
# ResourceWarning 多在 __del__ 中触发，pytest 以 PytestUnraisableExceptionWarning 报告，一并设为 error。
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
