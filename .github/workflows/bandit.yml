# Bandit: Python SAST(第三方)。CodeQL 之外的补充视角。
# 豁免清单见 bandit.toml (每条豁免有注释理由, 定期复审)。
name: Bandit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '51 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit bandit-sarif-formatter
      - name: Run bandit (SARIF)
        run: |
          bandit -r nbx app tools --skip B101,B103,B104,B108,B110,B112,B310,B404,B603,B607 --exclude nbx/vendor,.venv,tests -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
