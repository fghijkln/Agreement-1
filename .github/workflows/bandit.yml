# Bandit: Python SAST(第三方)。CodeQL 之外的补充视角。
# 豁免清单见 bandit.toml (每条豁免有注释理由, 定期复审)。
name: Bandit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '51 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit bandit-sarif-formatter
      # 1) 生成 SARIF 报告（--exit-zero 只用于报告生成这一步，供 Code Scanning 展示全部发现）
      - name: Run bandit (SARIF report)
        run: |
          bandit -r nbx app tools --skip B101,B103,B104,B108,B110,B112,B310,B404,B603,B607 --exclude nbx/vendor,.venv,tests -f sarif -o bandit.sarif --exit-zero
      # 2) 门禁：中/高危（且中/高置信度）发现直接让 CI 失败；不再 `|| true`。
      #    误报请在代码行加 `# nosec BXXX  <理由>`，或在 bandit.toml 登记豁免并更新 --skip。
      - name: Bandit gate (fail on medium/high severity)
        run: |
          bandit -r nbx app tools --skip B101,B103,B104,B108,B110,B112,B310,B404,B603,B607 --exclude nbx/vendor,.venv,tests --severity-level medium --confidence-level medium -f txt
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
